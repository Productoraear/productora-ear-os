name: Build & Push S-Class Docker Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: productoraear/productora-ear-os

jobs:
  contract-gate:
    # GATE FORENSE P0 (W41_T18): UNA sola fachada en /admin/control aborta el run
    # ANTES de construir y publicar la imagen. Sin este job, `npm run gate:prepush`
    # no lo ejecutaba nadie (no hay .husky ni core.hooksPath) y la regresion de
    # fachadas entraba en main con el CI en verde.
    # El auditor es zero-dependency (solo node:fs / node:path, solo lectura) y tarda
    # menos de 2 s, por eso corre primero sin necesidad de `npm ci` ni de inflar el build.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 22 = misma runtime que el Dockerfile (node:22-alpine). Node 20 está EOL.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Gate forense /admin/control (0 fachadas, --strict)
        run: node scripts/audit_admin_control_forensics.cjs --strict --md

      # Guardián del propio gate: si alguien borra un `needs`, condiciona un job
      # con `if:` o deja un gate en best-effort, este paso aborta el run. Sin él,
      # el cableado de abajo podría degradarse en silencio y volveríamos a la
      # misma fachada que este bloque cierra.
      - name: Gate de cableado CI/CD (needs y bloqueos reales)
        run: node scripts/audit_ci_gate_wiring.cjs

  typecheck-gate:
    # GATE P0: el build de Docker corre con `typescript.ignoreBuildErrors: true`
    # (next.config.ts:37) para no reventar por memoria el VPS de 4 GB. Consecuencia:
    # sin este job el CI podia PUBLICAR en GHCR una imagen con TypeScript roto, y el
    # unico `tsc --noEmit` real lo lanzaba un humano en local -> el gate era prosa.
    # Aqui se typechequea de verdad y en maquina limpia (npm ci, lock en sync
    # verificado con `--dry-run`): un error de tipos aborta el run ANTES de construir
    # y publicar la imagen. Coste medido del tsc en local: 33 s, 0 bytes de diagnostico.
    # No sustituye a voltear `ignoreBuildErrors` en el Dockerfile (eso exige medir
    # memoria en el VPS); lo que garantiza es que ninguna imagen con TS roto se publique.
    needs: contract-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      # Credenciales ficticias: `prisma generate` valida el schema y genera el cliente,
      # no abre conexion a PostgreSQL. Si faltan, Prisma aborta por env var ausente y
      # el gate fallaria por infraestructura en vez de por codigo del desarrollador.
      POSTGRES_PRISMA_URL: 'postgresql://ci:ci@127.0.0.1:5432/ci_typecheck?schema=public'
      POSTGRES_URL_NON_POOLING: 'postgresql://ci:ci@127.0.0.1:5432/ci_typecheck?schema=public'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (lock exacto, sin descargas de navegador)
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund

      - name: Generate Prisma client
        run: node ./node_modules/prisma/build/index.js generate

      - name: Typecheck (tsc --noEmit con el binario real, no el impostor de npx)
        run: node ./node_modules/typescript/bin/tsc --noEmit

      # El motor de voz es una ruta P0 de dinero indirecto: si el watchdog se rompe,
      # el asistente se queda mudo o cuelga la conversación en iOS/Android.
      # Evidencia determinista: 5 casos hostiles, Exit 0 sólo con 5/5.
      - name: Verificador del motor de voz (watchdog móvil, 5 casos)
        run: npm run verify:voice

  build-and-push:
    needs: [contract-gate, typecheck-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BEST-EFFORT a proposito: el despliegue real entra por el webhook git de
      # Coolify al hacer push. Si la API devuelve 401 (API access deshabilitado o
      # token sin permiso Deploy) el run NO puede morir aqui: el juez de verdad es
      # production-smoke. Un 401 en este paso marcaba production-smoke como SKIPPED
      # y el run quedaba verde sin haber comprobado produccion (fachada de CI).
      - name: Trigger Coolify Webhook Deployment (best-effort)
        if: success()
        continue-on-error: true
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::warning::COOLIFY_WEBHOOK_URL no esta definido en los secrets del repositorio."
            exit 1
          fi
          # Coolify v4 protege /api/v1/deploy con Sanctum: sin Bearer devuelve 401.
          AUTH=()
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $COOLIFY_API_TOKEN")
            echo "COOLIFY_AUTH=bearer"
          else
            echo "COOLIFY_AUTH=none"
          fi
          BODY_FILE="$(mktemp)"
          # Coolify documenta el trigger como POST; algunas versiones solo aceptan GET.
          call() {
            CODE="$(curl -sS -m 45 -o "$BODY_FILE" -w '%{http_code}' -X "$1" "${AUTH[@]}" "$COOLIFY_WEBHOOK" || echo '000')"
          }
          call POST
          echo "COOLIFY_METHOD=POST"
          if [ "$CODE" = "405" ]; then
            call GET
            echo "COOLIFY_METHOD=GET (POST devolvio 405)"
          fi
          echo "COOLIFY_HTTP=${CODE}"
          if [ -s "$BODY_FILE" ]; then
            echo "COOLIFY_BODY=$(head -c 300 "$BODY_FILE" | tr '\n\t' '  ')"
          else
            echo "COOLIFY_BODY=<vacio>"
          fi
          case "$CODE" in
            2*)
              echo "Deploy encolado en Coolify."
              ;;
            401|403)
              echo "::warning::Coolify devuelve ${CODE} (Unauthenticated). Precondiciones: Settings > Advanced > API access = Enabled, y API key creada en Keys & Tokens con permiso Deploy. Guardala como secret COOLIFY_API_TOKEN. El deploy NO esta en marcha."
              exit 1
              ;;
            *)
              echo "::warning::Coolify rechazo el webhook (HTTP ${CODE}). El deploy NO esta en marcha: revisar UUID de la app y el estado del panel."
              exit 1
              ;;
          esac

  production-smoke:
    # Puerta dura y JUEZ UNICO del despliegue: el run no puede quedar verde si
    # produccion no sirve la ruta. `always()` cierra el agujero: sin el, un fallo
    # en el job previo (401 de Coolify) dejaba este job en SKIPPED y el CI verde
    # sin haber mirado produccion.
    needs: [contract-gate, build-and-push]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke de produccion (ruta viva + landing real)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/prod_smoke_intake.cjs --wait=1500 --post
