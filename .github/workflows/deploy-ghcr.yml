name: Build & Push S-Class Docker Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: productoraear/productora-ear-os

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Webhook Deployment
        if: success()
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK_URL }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL no esta definido en los secrets del repositorio."
            exit 1
          fi
          BODY_FILE="$(mktemp)"
          CODE="$(curl -sS -m 45 -o "$BODY_FILE" -w '%{http_code}' -X GET "$COOLIFY_WEBHOOK" || echo '000')"
          echo "COOLIFY_HTTP=${CODE}"
          if [ -s "$BODY_FILE" ]; then
            echo "COOLIFY_BODY=$(head -c 300 "$BODY_FILE" | tr '\n\t' '  ')"
          else
            echo "COOLIFY_BODY=<vacio>"
          fi
          case "$CODE" in
            2*)
              echo "Deploy encolado en Coolify."
              ;;
            *)
              echo "::error::Coolify rechazo el webhook (HTTP ${CODE}). El deploy NO esta en marcha: revisar UUID de la app y el estado del panel."
              exit 1
              ;;
          esac

  production-smoke:
    # Puerta dura: el run no puede quedar verde si produccion no sirve la ruta.
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke de produccion (ruta viva + landing real)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/prod_smoke_intake.cjs --wait=1500 --post
