<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EAR OS — Fleet & Logistics Command Hub</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&f[]=cabinet-grotesk@500,700,800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050505; --panel:#0a0a0a; --line:rgba(255,255,255,.05);
      --text:#f5f1e8; --muted:#888; --gold:#ecb613; --blue:#4f8fc0; --red:#b84a5a; --green:#5ca04f;
    }
    *{box-sizing:border-box} html,body{height:100%;background:var(--bg);color:var(--text);font-family:'General Sans',sans-serif;margin:0;overflow:hidden}
    
    .dashboard{display:grid;grid-template-columns:400px 1fr 380px;height:100vh}
    
    .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px}
    .status-chip{padding:4px 12px;border-radius:999px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
    .status-scheduled{background:rgba(79,143,192,.1);color:var(--blue)}
    .status-dispatched{background:rgba(236,182,19,.1);color:var(--gold)}

    .waybill-card{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:all .3s}
    .waybill-card.active{border-color:var(--gold);background:rgba(236,182,19,.03)}
    
    .map-container{position:relative;background: radial-gradient(circle at center, #111 0%, #050505 100%);overflow:hidden}
    .map-grid{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);background-size:50px 50px}
    .unit-marker{position:absolute;width:40px;height:40px;transform:translate(-50%, -50%);z-index:10}
    .unit-marker .icon{width:100%;height:100%;background:var(--gold);clip-path:polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%);box-shadow:0 0 20px rgba(236,182,19,.5)}
    .unit-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--gold);white-space:nowrap;margin-top:8px}

    .telemetry{background:var(--panel);border-left:1px solid var(--line);padding:32px;display:flex;flex-direction:column;gap:32px}
    .stat-box{display:flex;flex-direction:column;gap:8px}
    .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted);font-weight:700}
    .stat-value{font-size:32px;font-weight:900;letter-spacing:-.02em}

    .header{grid-column:span 3;padding:20px 32px;background:rgba(5,5,5,.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .logo{font-family:'Cabinet Grotesk',sans-serif;font-size:24px;font-weight:900;letter-spacing:-.03em}
    .logo span{color:var(--gold)}

    .scheduled-overlay{
      position:absolute;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);
      display:none;align-items:center;justify-content:center;z-index:100;
    }
    .scheduled-card{background:var(--panel);border:1px solid var(--gold);padding:40px;border-radius:24px;text-align:center;box-shadow:0 0 50px rgba(236,182,19,0.2)}
  </style>
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div class="logo">EAR<span>OS</span> / FLEET COMMAND</div>
      <div style="font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--muted)" id="op-status">FLEET STATUS: STANDBY</div>
    </header>

    <aside class="sidebar">
      <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.3em;margin-bottom:10px">Active Waybills</h3>
      <div id="waybill-list"></div>
    </aside>

    <main class="map-container">
      <div class="map-grid"></div>
      <div id="map-units"></div>
      <div class="scheduled-overlay" id="sched-overlay">
        <div class="scheduled-card">
          <div class="eyebrow" style="color:var(--gold);margin-bottom:12px">Misión Programada</div>
          <h2 style="font-family:'Cabinet Grotesk',sans-serif;font-size:32px;margin:0">Tracking Inactivo</h2>
          <p class="muted" style="margin-top:16px">La unidad se encuentra en la Base de Méntrida.<br>El seguimiento comenzará mañana a las 12:00h.</p>
        </div>
      </div>
    </main>

    <section class="telemetry">
      <div id="active-waybill-detail">
        <h2 style="font-family:'Cabinet Grotesk',sans-serif;font-size:40px;margin-bottom:12px">Radar de Misión</h2>
        <div class="stat-box">
          <div class="stat-label">Estado Logístico</div>
          <div class="stat-value" id="t-status">---</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Ubicación Actual</div>
          <div class="stat-value" id="t-loc" style="font-size:18px">---</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Velocidad</div>
          <div class="stat-value" id="t-speed">0 KM/H</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const isScheduled = urlParams.get('status') === 'SCHEDULED';
    
    const waybills = [
      { id: 'WB-MENT-01', artist: 'Edwin Agudelo', origin: 'Méntrida Hub', status: isScheduled ? 'SCHEDULED' : 'DISPATCHED', unit: 'EA-01' }
    ];

    const units = {
      'EA-01': { 
        x: 300, y: 500, // Méntrida Base position
        targetX: 300, targetY: 500, 
        heading: 45, speed: 0, 
        lastPing: performance.now(), 
        waybillId: 'WB-MENT-01' 
      }
    };

    function tick(now) {
      if (!isScheduled) {
        // Normal LERP movement for DISPATCHED units
        Object.keys(units).forEach(id => {
          const u = units[id];
          const wb = waybills.find(w => w.id === u.waybillId);
          if (wb.status === 'DISPATCHED') {
            // Movement logic...
          }
        });
      }
      renderMap();
      renderTelemetry();
      requestAnimationFrame(tick);
    }

    function renderMap() {
      const container = document.getElementById('map-units');
      container.innerHTML = Object.keys(units).map(id => {
        const u = units[id];
        return `<div class="unit-marker" style="left:${u.x}px; top:${u.y}px"><div class="icon" style="transform:rotate(${u.heading}deg)"></div><div class="unit-label">${id}</div></div>`;
      }).join('');
    }

    function renderTelemetry() {
      const wb = waybills.find(w => w.id === 'WB-MENT-01');
      document.getElementById('t-status').innerText = wb.status;
      document.getElementById('t-status').style.color = isScheduled ? 'var(--blue)' : 'var(--gold)';
      document.getElementById('t-loc').innerText = isScheduled ? 'BASE: MÉNTRIDA HUB' : 'EN RUTA';
      
      if (isScheduled) {
        document.getElementById('sched-overlay').style.display = 'flex';
        document.getElementById('op-status').innerText = 'FLEET STATUS: MISSION SCHEDULED';
      }
    }

    // Initial render
    document.getElementById('waybill-list').innerHTML = waybills.map(wb => `
      <div class="waybill-card active">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px">
          <span style="font-weight:900">${wb.id}</span>
          <span class="status-chip status-${wb.status.toLowerCase()}">${wb.status}</span>
        </div>
        <div style="font-size:12px;font-weight:700">${wb.artist}</div>
      </div>
    `).join('');

    requestAnimationFrame(tick);
  </script>
</body>
</html>
