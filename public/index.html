  <head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'display': ['Cinzel', 'serif'],
              'body': ['Montserrat', 'sans-serif'],
            },
            colors: {
              'ear-gold': '#D4AF37',
              'ear-dark': '#0a0a0a',
              'ear-purple': '#2e0249',
              'ear-magic': '#570a57',
            },
            backgroundImage: {
              'tomorrowland': "linear-gradient(to bottom, rgba(10,10,10,0.8), rgba(46,2,73,0.9)), url('https://picsum.photos/id/119/1920/1080')",
              'gold-metallic': "linear-gradient(135deg, #D4AF37 0%, #FFF7CC 50%, #B8860B 100%)",
            },
            animation: {
              'fade-in': 'fade-in 0.5s ease-out forwards',
              'fade-in-up': 'fade-in-up 0.7s ease-out forwards',
              'scale-in': 'scale-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'spin-slow': 'spin 12s linear infinite',
              'pulse-glow': 'pulse-glow 3s ease-in-out infinite',
            },
            keyframes: {
              'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              'fade-in-up': { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              'scale-in': { '0%': { opacity: '0', transform: 'scale(0.9)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
              'pulse-glow': { '0%, 100%': { opacity: '0.5', filter: 'blur(10px)' }, '50%': { opacity: '1', filter: 'blur(5px)' } }
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #050505; color: #f3f3f3; overflow-x: hidden; scroll-behavior: smooth; }
      .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
      .gold-glow { text-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
      .text-shadow-lg { text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
      * { transition-property: background-color, border-color, color, fill, stroke, transform, opacity; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 300ms; }
      .custom-scrollbar::-webkit-scrollbar { width: 3px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #050505; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      ::selection { background: #D4AF37; color: #000; }
    </style>
